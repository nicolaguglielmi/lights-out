# oauth2-proxy configuration for lights-out console (ADR 0111)
#
# Usage:
#   OAUTH2_PROXY_CLIENT_SECRET=... OAUTH2_PROXY_COOKIE_SECRET=... \
#     oauth2-proxy --config deploy/proxy/oauth2-proxy.cfg
#
# Start console with:
#   CONSOLE_AUTH=proxy
#   CONSOLE_IDENTITY_HEADER=X-Auth-Request-Email
#   CONSOLE_LAUNCHERS=alice@example.com,bob@example.com
#   CONSOLE_HOSTS=console.example.com
#   CONSOLE_PUBLISH=127.0.0.1
#   CONSOLE_PORT=8098

provider = "oidc"
oidc_issuer_url = "https://idp.example.com/realms/lights-out"
client_id = "lights-out-console"
# Inject real secret via environment variable OAUTH2_PROXY_CLIENT_SECRET
client_secret = "REPLACE_WITH_OIDC_CLIENT_SECRET"
# Generate with: python3 -c 'import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
cookie_secret = "REPLACE_WITH_32_BYTE_COOKIE_SECRET"

http_address = "127.0.0.1:4180"
redirect_url = "https://console.example.com/oauth2/callback"
upstreams = [
  "http://127.0.0.1:8098/"
]

# Restrict login to verified email domains (or use oidc_groups)
email_domains = [
  "example.com"
]

# Forward verified identity header expected by CONSOLE_IDENTITY_HEADER
set_xauthrequest = true
pass_user_headers = true
pass_access_token = false
pass_authorization_header = false

# Cookie hardening
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
reverse_proxy = true
skip_provider_button = true
