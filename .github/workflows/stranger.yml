# The first fifteen minutes of a stranger (docs/launch/onboarding-findings.md):
# the README's Linux path followed literally on a fresh runner, with podman,
# the reference engine, and no CONTAINER_ENGINE anywhere. Every other job
# runs docker; this one is the README's own promise. Each step's wall time
# is printed and lands in the run's summary. GitHub-only, every job
# (docs/adr/0039); the guard is inert since the L0 runner left (docs/adr/
# 0060 §6).
name: stranger

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # docs/adr/0065: whether this push is judged here (a commit already green
  # on a branch is not judged again on main) and how much of it (a
  # docs-only push skips the heavy jobs). Every other job needs it.
  plan:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/plan.sh
          sparse-checkout-cone-mode: false
      - id: plan
        run: sh .github/plan.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}

  # README "Try it", Linux: install podman, enable its API socket, clone,
  # ./go doctor, ./go demo. No actions/checkout: a stranger clones.
  demo:
    runs-on: ubuntu-latest
    needs: plan
    if: github.server_url == 'https://github.com' && needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    env:
      TIMES: ${{ github.workspace }}/../stranger-times.txt
      GH_TOKEN: ${{ github.token }}
      # docs/adr/0093 §6: the regression budget, from the measured runs in
      # its "After" section.
      STRANGER_BUDGET_SECONDS: 600
    steps:
      - name: 1. Install podman (README, Linux)
        run: |
          s=$(date +%s)
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q podman
          podman --version
          echo "install podman: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: 1. systemctl --user enable --now podman.socket (README, Linux)
        run: |
          s=$(date +%s)
          systemctl --user enable --now podman.socket
          systemctl --user is-active podman.socket
          podman info --format 'API socket {{.Host.RemoteSocket.Path}} exists={{.Host.RemoteSocket.Exists}}'
          echo "enable podman.socket: $(( $(date +%s) - s ))s" >> "$TIMES"
      # The repository is private until launch: the clone carries the job's
      # token in a header, never in the remote URL. A stranger types the
      # README's plain git clone.
      - name: 2. git clone (README), at the pushed commit
        run: |
          s=$(date +%s)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" lights-out
          git -C lights-out checkout -q "$GITHUB_SHA"
          git -C lights-out log --oneline -1
          echo "git clone: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: ./go doctor (README, "If something goes wrong", run first)
        working-directory: lights-out
        run: |
          s=$(date +%s)
          rc=0; ./go doctor || rc=$?
          echo "./go doctor: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      # docs/adr/0093 §6: a stranger often has a dev server on 3000 and
      # something on 8080. Both held here, on every address, before the
      # demo; the preflight must move Gitea and the app, and say so.
      - name: A stranger's machine, 3000 and 8080 already taken
        run: |
          for p in 3000 8080; do nohup python3 -m http.server "$p" >/dev/null 2>&1 & done
          sleep 1
          ss -ltn | grep -E ':(3000|8080) '
      - name: 2. ./go demo, no CONTAINER_ENGINE
        working-directory: lights-out
        run: |
          [ -z "${CONTAINER_ENGINE:-}" ] || { echo "CONTAINER_ENGINE is set; a stranger has none"; exit 1; }
          s=$(date +%s)
          # What a person sees (core/progress.sh), each line prefixed with
          # the seconds since ./go demo started; the whole run is in
          # .crew/demo/run.log.
          ./go demo 2>&1 | perl -pe 'BEGIN { $| = 1; $t0 = time } $_ = sprintf("%4ds %s", time - $t0, $_)' | tee "$RUNNER_TEMP/demo.log"
          rc=${PIPESTATUS[0]}
          t=$(( $(date +%s) - s ))
          echo "./go demo: ${t}s, exit $rc" >> "$TIMES"
          [ "$rc" -eq 0 ] || exit "$rc"
          # The preflight moved both, and named each (docs/adr/0093 §1d).
          grep -E 'preflight: ports +3000 is held by .*: the code host moves to 3001' .crew/demo/run.log
          grep -E 'preflight: ports +8080 is held by .*: the app moves to 8081' .crew/demo/run.log
          grep -qx 'CODE_HOST_PORT=3001' .crew/ports.env && grep -qx 'APP_PORT=8081' .crew/ports.env
          # The end: the run's own console, on ticket 0001 (§4).
          grep -F "See why, step by step: file://$PWD/.crew/demo/console.html#ticket/0001" "$RUNNER_TEMP/demo.log"
          test -s .crew/demo/console.html
          # The regression budget (§6), tighter than the plan's 900 s.
          budget=${STRANGER_BUDGET_SECONDS}
          [ "$t" -le "$budget" ] || { echo "::error::./go demo took ${t}s on a clean runner, over the ${budget}s regression budget (docs/adr/0093 §6)"; exit 1; }
          echo "./go demo: ${t}s, within the ${budget}s regression budget" >> "$TIMES"
      # The demo's last line points at ./go try (docs/adr/0093 §5); the
      # tutorial's level 2 runs it on a copy of workloads/minimal-js with no
      # contract, fresh git, one commit. Here, after the demo, as a stranger
      # would: the toolchain image is built, the plane is still up.
      - name: 3. ./go try on a repository of your own (tutorial, level 2)
        working-directory: lights-out
        run: |
          set -eu
          repo="$HOME/code/your-repo"
          mkdir -p "$repo"
          cp -R workloads/minimal-js/. "$repo/"
          rm -rf "$repo/.lights-out"
          git -C "$repo" init -q -b main
          git -C "$repo" -c user.name=stranger -c user.email=stranger@lights-out.invalid add -A
          git -C "$repo" -c user.name=stranger -c user.email=stranger@lights-out.invalid commit -q -m "your code"
          s=$(date +%s)
          rc=0; ./go try "$repo" > "$RUNNER_TEMP/try.out" 2> "$RUNNER_TEMP/try.err" || rc=$?
          echo "./go try: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          cat "$RUNNER_TEMP/try.out"
          cat "$RUNNER_TEMP/try.err" >&2
          [ "$rc" -eq 0 ] || exit "$rc"
          # One line on stdout, the gates' own verdict; the draft kept, the
          # repository untouched, nothing left attached (docs/adr/0093 §5).
          [ "$(wc -l < "$RUNNER_TEMP/try.out")" -eq 1 ]
          grep -E '^GO: try — javascript; the eight gates on your last commit: .*; the draft is in \.crew/try/your-repo/\.lights-out$' "$RUNNER_TEMP/try.out"
          test -s .crew/try/your-repo/.lights-out/workload.env
          [ ! -e "$repo/.lights-out" ] && [ -z "$(git -C "$repo" status --porcelain)" ]
          [ ! -e .attached ]
          grep -F '[try] keep the contract: cp -R' "$RUNNER_TEMP/try.err"
      - if: always()
        name: The plane, as the demo left it, and the disk it took (docs/adr/0093 §1c)
        run: |
          podman ps -a --format '{{.Names}} {{.Status}}' || true
          podman system df || true
      # verify's judgement reads Envoy upstream cluster metrics (docs/adr/0098).
      - if: always()
        name: Prometheus, Envoy clusters and the traffic query
        run: |
          curl -sS -G localhost:9090/api/v1/query --data-urlencode 'query=envoy_cluster_upstream_rq_completed' | jq -c '.data.result[] | .metric' || true
          curl -sS -G localhost:9090/api/v1/query --data-urlencode 'query=count by (job, instance, envoy_cluster_name) (envoy_cluster_upstream_rq_completed)' | jq -c '.data.result[]' || true
          q=$(sed -n '/^# name: traffic$/{n;p;}' lights-out/verify/slo.promql)
          curl -sS -G localhost:9090/api/v1/query --data-urlencode "query=$q" | jq -c . || true
          curl -sS -G localhost:9090/api/v1/targets | jq -c '.data.activeTargets[] | {job: .labels.job, instance: .labels.instance, health, lastError}' || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stranger-demo-log
          path: |
            ${{ runner.temp }}/demo.log
            lights-out/.crew/demo/run.log
            lights-out/.crew/demo/steps.tsv
            lights-out/.crew/demo/console.html
            lights-out/.crew/ports.env
            ${{ runner.temp }}/try.out
            ${{ runner.temp }}/try.err
          if-no-files-found: ignore
      # Last, so the tail of the job log is the digest: every verdict and
      # stage line of ./go demo, with its second, and each step's wall time.
      - if: always()
        name: Digest, and the wall time of each step
        run: |
          cat "$RUNNER_TEMP/demo.log" || true
          grep -E '^(GO|NO-GO)|^(go|preflight|engine-compat):|^\[(demo|tower|launchpad|ci)\]|^(deploy|slo:| +slo:)|building workbench|rolled back' lights-out/.crew/demo/run.log | cut -c1-240 || true
          cat lights-out/.crew/demo/steps.tsv || true
          cat "$TIMES" || true
          cat "$RUNNER_TEMP/try.out" || true
          { echo '### stranger: demo (podman)'; echo '```'; cat "$RUNNER_TEMP/demo.log" || true; echo; cat "$RUNNER_TEMP/try.out" || true; cat "$TIMES" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The second door (docs/adr/0097 §2): the README's "Open in Codespaces",
  # proved without anyone's Codespaces account. devcontainers/ci builds
  # .devcontainer/ as Codespaces would (the devcontainer CLI, Docker-in-
  # Docker) and runs ./go demo inside it, timed. The runner is not a
  # codespace: same container, same 4 CPUs, a different VM.
  codespace:
    runs-on: ubuntu-latest
    needs: plan
    if: github.server_url == 'https://github.com' && needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The runner's disk, before
        run: df -h / | tail -1
      - name: ./go demo in the dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -u
            git config --global --add safe.directory "$PWD"
            s=$(date +%s)
            rc=0; ./go demo || rc=$?
            t=$(( $(date +%s) - s ))
            printf 'codespace: ./go demo %ss, exit %s\n' "$t" "$rc" | tee .crew/codespace-times.txt
            docker system df || true
            exit "$rc"
      - if: always()
        name: Digest, and the wall time
        run: |
          cat .crew/demo/steps.tsv || true
          cat .crew/codespace-times.txt || true
          grep -E '^(GO|NO-GO)' .crew/demo/run.log | cut -c1-240 || true
          { echo '### stranger: codespace (the dev container, docker)'; echo '```'; cat .crew/codespace-times.txt || true; grep -E '^(GO|NO-GO): demo' .crew/demo/run.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stranger-codespace-log
          path: |
            .crew/demo/run.log
            .crew/demo/steps.tsv
            .crew/codespace-times.txt
          if-no-files-found: ignore

  # README "On your repository, without cloning lights-out", as far as it
  # works with no published image: ./go package from a clone, the wrapper
  # on workloads/minimal copied into a fresh repository, with podman.
  package:
    runs-on: ubuntu-latest
    needs: plan
    if: github.server_url == 'https://github.com' && needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    env:
      TIMES: ${{ github.workspace }}/../stranger-times.txt
      GH_TOKEN: ${{ github.token }}
      LIGHTS_OUT_IMAGE: localhost/lights-out-gates:dev
    steps:
      - name: Install podman (README, Linux)
        run: |
          s=$(date +%s)
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q podman
          podman --version
          echo "install podman: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: git clone, at the pushed commit
        run: |
          s=$(date +%s)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" lights-out
          git -C lights-out checkout -q "$GITHUB_SHA"
          echo "git clone: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: ./go package-gates
        working-directory: lights-out
        run: |
          s=$(date +%s)
          rc=0; ./go package-gates || rc=$?
          echo "./go package-gates: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          podman image ls localhost/lights-out-gates
          exit "$rc"
      - name: The wrapper on your PATH (README)
        run: |
          mkdir -p "$HOME/.local/bin"
          cp lights-out/lights-out "$HOME/.local/bin/lights-out"
          chmod +x "$HOME/.local/bin/lights-out"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # workloads/minimal's tests read .lights-out/flags/flags.json, its own
      # data, so that stays; the rest of .lights-out/ (the contract and the
      # plane half) goes, so the repository is a stranger's: no contract yet.
      # Leaving the plane half without workload.env makes init's draft fail
      # the contract check (docs/launch/onboarding-findings.md).
      - name: A repository of your own (workloads/minimal, fresh git, no contract)
        run: |
          set -eu
          repo="$HOME/code/your-repo"
          mkdir -p "$repo"
          cp -R lights-out/workloads/minimal/. "$repo/"
          find "$repo/.lights-out" -mindepth 1 -maxdepth 1 ! -name flags -exec rm -rf {} +
          ls -A "$repo/.lights-out"
          git -C "$repo" init -q -b main
          git -C "$repo" config user.name stranger
          git -C "$repo" config user.email stranger@lights-out.invalid
          git -C "$repo" add -A
          git -C "$repo" commit -q -m "your code"
      - name: lights-out doctor
        working-directory: /home/runner/code/your-repo
        run: |
          s=$(date +%s)
          rc=0; lights-out doctor || rc=$?
          echo "lights-out doctor: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - name: lights-out init, then the README's cp and commit
        working-directory: /home/runner/code/your-repo
        run: |
          set -eu
          s=$(date +%s)
          lights-out init
          echo "lights-out init: $(( $(date +%s) - s ))s" >> "$TIMES"
          cp -R ~/.local/state/lights-out/your-repo/.lights-out/. .lights-out/
          git add .lights-out && git commit -q -m "add lights-out contract"
      - name: lights-out gates (the last commit)
        working-directory: /home/runner/code/your-repo
        run: |
          s=$(date +%s)
          rc=0; lights-out gates || rc=$?
          echo "lights-out gates (contract commit): $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - name: lights-out gates on a code change
        working-directory: /home/runner/code/your-repo
        run: |
          set -eu
          printf '\n\n@app.get("/version")\ndef version():\n    return {"version": APP_VERSION}\n' >> minimal/app.py
          printf '\n\ndef test_version_returns_the_app_version(client):\n    assert client.get("/version").json() == {"version": APP_VERSION}\n' >> tests/test_app.py
          git commit -q -am "a /version route, and its test"
          s=$(date +%s)
          rc=0; lights-out gates || rc=$?
          echo "lights-out gates (code change): $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - if: always()
        name: Wall time of each step
        run: |
          cat "$TIMES" || true
          { echo '### stranger: package (podman)'; echo '```'; cat "$TIMES" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
