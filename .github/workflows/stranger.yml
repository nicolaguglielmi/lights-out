# The first fifteen minutes of a stranger (docs/launch/onboarding-findings.md):
# the README's Linux path followed literally on a fresh runner, with podman,
# the reference engine, and no CONTAINER_ENGINE anywhere. Every other job
# runs docker; this one is the README's own promise. Each step's wall time
# is printed and lands in the run's summary. GitHub-only, every job: the
# L0 Gitea runner reads this directory too and holds the engine socket
# (docs/adr/0039).
name: stranger

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # README "Try it", Linux: install podman, enable its API socket, clone,
  # ./go doctor, ./go demo. No actions/checkout: a stranger clones.
  demo:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    env:
      TIMES: ${{ github.workspace }}/../stranger-times.txt
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 1. Install podman (README, Linux)
        run: |
          s=$(date +%s)
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q podman
          podman --version
          echo "install podman: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: 1. systemctl --user enable --now podman.socket (README, Linux)
        run: |
          s=$(date +%s)
          systemctl --user enable --now podman.socket
          systemctl --user is-active podman.socket
          podman info --format 'API socket {{.Host.RemoteSocket.Path}} exists={{.Host.RemoteSocket.Exists}}'
          echo "enable podman.socket: $(( $(date +%s) - s ))s" >> "$TIMES"
      # The repository is private until launch: the clone carries the job's
      # token in a header, never in the remote URL. A stranger types the
      # README's plain git clone.
      - name: 2. git clone (README), at the pushed commit
        run: |
          s=$(date +%s)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" lights-out
          git -C lights-out checkout -q "$GITHUB_SHA"
          git -C lights-out log --oneline -1
          echo "git clone: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: ./go doctor (README, "If something goes wrong", run first)
        working-directory: lights-out
        run: |
          s=$(date +%s)
          rc=0; ./go doctor || rc=$?
          echo "./go doctor: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - name: 2. ./go demo, no CONTAINER_ENGINE
        working-directory: lights-out
        run: |
          [ -z "${CONTAINER_ENGINE:-}" ] || { echo "CONTAINER_ENGINE is set; a stranger has none"; exit 1; }
          s=$(date +%s)
          # Each line prefixed with the seconds since ./go demo started.
          ./go demo 2>&1 | perl -pe 'BEGIN { $| = 1; $t0 = time } $_ = sprintf("%4ds %s", time - $t0, $_)' | tee "$RUNNER_TEMP/demo.log"
          rc=${PIPESTATUS[0]}
          echo "./go demo: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - if: always()
        name: The plane, as the demo left it
        run: |
          podman ps -a --format '{{.Names}} {{.Status}}' || true
          podman logs --tail 40 lights-out-runner-1 || true
      # verify's judgement reads target_info joined on (job, instance): a
      # 422 from Prometheus is two target_info series on one side.
      - if: always()
        name: Prometheus, target_info and the traffic query
        run: |
          curl -sS -G localhost:9090/api/v1/query --data-urlencode 'query=target_info' | jq -c '.data.result[] | .metric' || true
          curl -sS -G localhost:9090/api/v1/query --data-urlencode 'query=count by (job, instance) (target_info)' | jq -c '.data.result[]' || true
          q=$(sed -n '/^# name: traffic$/{n;p;}' lights-out/verify/slo.promql)
          curl -sS -G localhost:9090/api/v1/query --data-urlencode "query=$q" | jq -c . || true
          curl -sS -G localhost:9090/api/v1/targets | jq -c '.data.activeTargets[] | {job: .labels.job, instance: .labels.instance, health, lastError}' || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stranger-demo-log
          path: ${{ runner.temp }}/demo.log
          if-no-files-found: ignore
      # Last, so the tail of the job log is the digest: every verdict and
      # stage line of ./go demo, with its second, and each step's wall time.
      - if: always()
        name: Digest, and the wall time of each step
        run: |
          grep -E '^ *[0-9]+s (GO|NO-GO)|^ *[0-9]+s (go|doctor|engine-compat):|^ *[0-9]+s \[(demo|tower|launchpad|ci)\]|^ *[0-9]+s (deploy|slo:| +slo:)|building workbench|rolled back' "$RUNNER_TEMP/demo.log" | cut -c1-240 || true
          cat "$TIMES" || true
          { echo '### stranger: demo (podman)'; echo '```'; cat "$TIMES" || true; grep -E '^ *[0-9]+s (GO|NO-GO): demo' "$RUNNER_TEMP/demo.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # README "On your repository, without cloning lights-out", as far as it
  # works with no published image: ./go package from a clone, the wrapper
  # on workloads/minimal copied into a fresh repository, with podman.
  package:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    env:
      TIMES: ${{ github.workspace }}/../stranger-times.txt
      GH_TOKEN: ${{ github.token }}
      LIGHTS_OUT_IMAGE: localhost/lights-out:dev
    steps:
      - name: Install podman (README, Linux)
        run: |
          s=$(date +%s)
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q podman
          podman --version
          echo "install podman: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: git clone, at the pushed commit
        run: |
          s=$(date +%s)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" lights-out
          git -C lights-out checkout -q "$GITHUB_SHA"
          echo "git clone: $(( $(date +%s) - s ))s" >> "$TIMES"
      - name: ./go package
        working-directory: lights-out
        run: |
          s=$(date +%s)
          rc=0; ./go package || rc=$?
          echo "./go package: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          podman image ls localhost/lights-out
          exit "$rc"
      - name: The wrapper on your PATH (README)
        run: |
          mkdir -p "$HOME/.local/bin"
          cp lights-out/lights-out "$HOME/.local/bin/lights-out"
          chmod +x "$HOME/.local/bin/lights-out"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # workloads/minimal's tests read .lights-out/flags/flags.json, its own
      # data, so that stays; the rest of .lights-out/ (the contract and the
      # plane half) goes, so the repository is a stranger's: no contract yet.
      # Leaving the plane half without workload.env makes init's draft fail
      # the contract check (docs/launch/onboarding-findings.md).
      - name: A repository of your own (workloads/minimal, fresh git, no contract)
        run: |
          set -eu
          repo="$HOME/code/your-repo"
          mkdir -p "$repo"
          cp -R lights-out/workloads/minimal/. "$repo/"
          find "$repo/.lights-out" -mindepth 1 -maxdepth 1 ! -name flags -exec rm -rf {} +
          ls -A "$repo/.lights-out"
          git -C "$repo" init -q -b main
          git -C "$repo" config user.name stranger
          git -C "$repo" config user.email stranger@lights-out.invalid
          git -C "$repo" add -A
          git -C "$repo" commit -q -m "your code"
      - name: lights-out doctor
        working-directory: /home/runner/code/your-repo
        run: |
          s=$(date +%s)
          rc=0; lights-out doctor || rc=$?
          echo "lights-out doctor: $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - name: lights-out init, then the README's cp and commit
        working-directory: /home/runner/code/your-repo
        run: |
          set -eu
          s=$(date +%s)
          lights-out init
          echo "lights-out init: $(( $(date +%s) - s ))s" >> "$TIMES"
          cp -R ~/.local/state/lights-out/your-repo/.lights-out/. .lights-out/
          git add .lights-out && git commit -q -m "add lights-out contract"
      - name: lights-out gates (the last commit)
        working-directory: /home/runner/code/your-repo
        run: |
          s=$(date +%s)
          rc=0; lights-out gates || rc=$?
          echo "lights-out gates (contract commit): $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - name: lights-out gates on a code change
        working-directory: /home/runner/code/your-repo
        run: |
          set -eu
          printf '\n\n@app.get("/version")\ndef version():\n    return {"version": APP_VERSION}\n' >> minimal/app.py
          printf '\n\ndef test_version_returns_the_app_version(client):\n    assert client.get("/version").json() == {"version": APP_VERSION}\n' >> tests/test_app.py
          git commit -q -am "a /version route, and its test"
          s=$(date +%s)
          rc=0; lights-out gates || rc=$?
          echo "lights-out gates (code change): $(( $(date +%s) - s ))s, exit $rc" >> "$TIMES"
          exit "$rc"
      - if: always()
        name: Wall time of each step
        run: |
          cat "$TIMES" || true
          { echo '### stranger: package (podman)'; echo '```'; cat "$TIMES" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
