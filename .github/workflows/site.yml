# The landing page on GitHub Pages, with videos rendered from the board
# (docs/adr/0048). `render` runs on every push that touches the site, the
# board, the cover or this file, on any branch: it builds _site/ (the
# landing, the board itself, the cover), records the board's scenarios with
# Playwright and encodes them with ffmpeg, all inside the Playwright image,
# then uploads the Pages artifact and, for review, the screenshots. `deploy`
# publishes it, on main only. The videos are build outputs: never in git.
# GitHub-only, every job: the L0 Gitea runner reads this directory too
# (docs/adr/0039), and Pages has no Gitea counterpart.
name: site

on:
  push:
    paths:
      - site/**
      - board/index.html
      - docs/assets/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # A newer push replaces a render on a branch; a deploy on main runs out.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  render:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    timeout-minutes: 30
    container:
      # Playwright 1.64.1 with Chromium and the Python package, verified on
      # mcr.microsoft.com 2026-11-05; the digest is the multi-arch index's.
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image bakes in the browsers, not the package that drives them:
      # the same version, so it finds them under /ms-playwright.
      - name: ffmpeg from the image's Ubuntu archive, playwright from PyPI
        run: |
          pip install --no-cache-dir --quiet playwright==1.64.1
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          ffmpeg -version | head -1
      - name: the site, without its media
        run: |
          mkdir -p _site/board _site/assets
          cp site/index.html _site/
          cp board/index.html _site/board/
          cp docs/assets/lights-out.jpg _site/assets/
      - name: the videos, from the board
        run: python3 site/render.py _site
        env:
          SHOTS: shots
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-review
          path: |
            shots
            _site/media/hero.gif
            _site/media/hero.jpg
            _site/media/overview.jpg
          retention-days: 14

  deploy:
    needs: render
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
