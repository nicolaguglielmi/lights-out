# The reference engine, rootless podman, on the harness boundary
# (docs/adr/0046): `./go harness-conformance` for one harness, case 9 the
# one that matters here (the internal `crew` network, the egress proxy,
# DNS from an internal network under aardvark-dns). claude-code only: the
# confinement is compose's and the proxy's, the same for every harness,
# and one CLI image keeps the job short. A workflow of its own, so a
# runner-side podman problem shows here without turning `ci` red; its
# result is read and reported, never ignored. GitHub-only (docs/adr/0039).
name: podman

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-conformance-podman:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ./go hands workbench podman's API socket; the runner does not start
      # it. The user unit first, a foreground-less service as the fallback.
      - run: |
          podman --version
          systemctl --user enable --now podman.socket || { nohup podman system service --time=0 >/tmp/podman-service.log 2>&1 & sleep 3; }
          podman info --format 'socket {{.Host.RemoteSocket.Path}} exists={{.Host.RemoteSocket.Exists}} network={{.Host.NetworkBackend}} rootless={{.Host.Security.Rootless}}'
      - run: ./go harness-conformance CONFORMANCE_HARNESS=claude-code
        env:
          CONTAINER_ENGINE: podman
