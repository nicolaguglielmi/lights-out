name: Cloud Delivery Conformance (Azure Container Apps OIDC)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  delivery-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC (keyless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Delivery conformance
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          METRICS: promql
          METRICS_URL: ${{ vars.METRICS_URL }}
        run: |
          ./go delivery-conformance DELIVERY=outside/azure-container-apps ADAPTERS_PATH="$PWD/plugins/cloud"
