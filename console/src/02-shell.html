<script>
// The theme and persona before the first paint (docs/adr/0059 §2, 0126): the
// browser's choice, or the default when there is none or storage is refused.
(function () {
  let t = "system", p = "";
  try {
    t = localStorage.getItem("lights-out.theme") || "system";
    p = localStorage.getItem("lights-out.persona") || "";
  } catch (e) { /* storage refused */ }
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  document.documentElement.dataset.persona = p === "senior" ? "senior" : "junior";
})();
</script>

<!-- The tower's transition table, as board/index.html embeds it (docs/adr/
     0035), with who runs each step and the bands the columns sit under
     (docs/adr/0063 §2). ./go ci proves next equal to core/tower.py's,
     who naming every step of its PRECONDITION and no other, actor doing
     the same with the card's badge (docs/adr/0068 §2), and the bands
     holding core/logbook.py's COLUMNS in their order. The page reads no
     other copy, and no sentence carries a number of its own. -->
<script type="application/json" id="tower-machine">
{"next": {"intake": "interview", "drafted": "perimeter", "requested": "clarify", "spec-ready": "spec", "opened": "assign", "pr-opened": "ci", "review": "review", "ci-passed": "merge", "merged": "mainline", "main-green": "release", "ci-failed": "rework"},
 "who": {"interview": "The product role interviews the client: a question, or the tickets proposed",
         "intake-answer": "The product role reads the answer: a question, or the tickets proposed",
         "perimeter": "The architect role proposes each ticket's perimeter from the project map",
         "clarify": "The product role reads the request: a question, or the criteria confirmed",
         "answer": "The product role reads the answer: a question, or the criteria confirmed",
         "spec": "The spec gate checks the criteria",
         "assign": "The dev-worker takes it and opens a PR",
         "ci": "The gates judge the PR",
         "review": "The reviewer reads the diff",
         "merge": "The merge step merges the PR",
         "mainline": "Main's check runs after the merge",
         "release": "The canary goes out, each stage verified before the next",
         "rework": "The dev-worker reworks it with the verdict"},
 "actor": {"interview": "product", "intake-answer": "product", "perimeter": "architect", "clarify": "product", "answer": "product", "spec": "spec", "assign": "dev", "ci": "gates", "review": "reviewer",
           "merge": "tower", "mainline": "tower", "release": "canary", "rework": "dev"},
 "bands": [{"band": "spec", "name": "Spec", "states": ["requested", "questions", "spec-ready"]},
           {"band": "build", "name": "Build", "states": ["opened", "pr-opened"]},
           {"band": "test", "name": "Test and review", "states": ["review", "ci-passed", "ci-failed", "needs-human"]},
           {"band": "release", "name": "Release", "states": ["merged", "main-green", "held", "rolled-back"]}]}
</script>
